edition = "2024";

package wgf.controlapi.v1;

option go_package = "github.com/kurochan/wg-frag-go/proto/controlapi/v1;controlapiv1";

// ControlAPI is the local per-interface management API served on a private
// Unix domain socket. It exposes only user-facing state: hidden carrier
// addresses and wireguard-go internals never appear here.
service ControlAPI {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc ApplyConfig(ApplyConfigRequest) returns (ApplyConfigResponse);
}

message GetStatusRequest {
  // Only the privileged local showconf path sets this flag.
  bool include_secrets = 1;
}

// ApplyConfigRequest carries the complete desired peer set. Interface
// identity (private key, listen port, MTU) cannot change at runtime; requests
// implying such a change are rejected.
message ApplyConfigRequest {
  // request_id is a client-generated nonzero 16-byte value. Retrying the same
  // id with the same snapshot returns the cached first result.
  bytes request_id = 1;
  // expected_generation guards against concurrent writers; it must match the
  // generation reported by GetStatus.
  uint64 expected_generation = 2;
  repeated DesiredPeer peers = 3;
}

message DesiredPeer {
  string public_key = 1;  // base64, as in wg(8)
  string endpoint = 2;
  repeated string allowed_ips = 3;
  uint32 persistent_keepalive_sec = 4;
  // Raw 32-byte key. The action controls whether an omitted key is preserved
  // or cleared during a peer-set update.
  bytes preshared_key = 5;
  PresharedKeyAction preshared_key_action = 6;
}

enum PresharedKeyAction {
  PRESERVE = 0;
  SET = 1;
  CLEAR = 2;
}

message ApplyConfigResponse {
  uint64 generation = 1;
  repeated PeerResult results = 2;
}

message PeerResult {
  string public_key = 1;
  // error is empty on success. A failed peer stays fail-closed rather than
  // reverting to its previous state.
  string error = 2;
}

message GetStatusResponse {
  string interface_name = 1;
  string public_key = 2;
  uint32 listen_port = 3;
  uint32 mtu = 4;
  reserved 5;
  ShimCounters counters = 6;
  repeated PeerStatus peers = 7;
  reserved 8;
  // generation increments on every applied configuration change and gates
  // ApplyConfig.expected_generation.
  uint64 generation = 9;
}

message PeerStatus {
  string public_key = 1;
  string endpoint = 2;
  repeated string allowed_ips = 3;
  int64 last_handshake_unix = 4;
  uint64 transfer_rx_bytes = 5;
  uint64 transfer_tx_bytes = 6;
  uint32 persistent_keepalive_sec = 7;

  // WGF extensions.
  uint32 confirmed_carrier_payload = 8;
  bool pmtu_searching = 9;
  // data_ready is true when every CONTROL gate has confirmed and outbound
  // DATA is enabled for this peer.
  bool data_ready = 10;
  // Stable local CONTROL path status (for example BASE, SEARCHING,
  // SEARCH_COMPLETE, or ERROR).
  string control_path_state = 11;
  // Stable diagnostic reason when control_path_state is ERROR.
  string control_path_error = 12;
  // Present only on the owner-controlled local socket so set/showconf can
  // preserve a configured key; the normal show renderer does not print it.
  bytes preshared_key = 13;
}

message ShimCounters {
  uint64 tx_carriers = 1;
  uint64 tx_packet_drops = 2;
  uint64 tx_route_drops = 3;
  uint64 tx_peer_mtu_drops = 13;
  uint64 tx_ptb_sent = 14;
  uint64 control_exploratory_evictions = 15;
  uint64 control_coalesces = 16;
  uint64 control_rate_suppression_episodes = 17;
  uint64 control_ingress_rate_limited = 18;
  uint64 rx_data_carriers = 4;
  uint64 rx_inner_delivered = 5;
  uint64 rx_packet_rejects = 6;
  uint64 rx_source_spoof_drops = 7;
  uint64 rx_native_write_drops = 8;
  uint64 carrier_queue_overflows = 9;
  uint64 preconfirm_drops = 10;
  uint64 reassembly_expirations = 11;
  uint64 udp_socket_drops = 12;
  uint64 control_queue_drops = 19;
  uint64 control_materialization_drops = 20;
}
