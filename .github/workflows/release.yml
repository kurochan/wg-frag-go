name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify checked-out revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Download tool dependencies
        run: make tools-download

      - name: Verify generated protobuf
        run: make proto-check

      - name: Run tests
        run: make test

      - name: Run race tests
        run: make test-race

      - name: Run static analysis
        run: go vet ./...

      - name: Run lint
        run: make lint

  release:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify checked-out revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Release with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ppa:
    name: Publish Launchpad PPA source
    needs: [verify, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: launchpad
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify checked-out revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            debhelper devscripts dput gnupg

      - name: Prepare vendored source
        run: |
          set -eu
          debian_version="$(dpkg-parsechangelog --show-field Version)"
          upstream_version="$(printf '%s' "$debian_version" | sed 's/-[0-9][^-]*$//')"
          tag_version="${GITHUB_REF_NAME#v}"
          expected_version="$(printf '%s' "$tag_version" | sed -E 's/-([[:alnum:]]+)\./~\1./g')"
          test "$upstream_version" = "$expected_version"
          go mod vendor
          go test -mod=vendor ./...
          dpkg-buildpackage -S -sa -d -us -uc

      - name: Sign and upload source package
        env:
          DEBEMAIL: kuro@kurochan.org
          DEBFULLNAME: kurochan
          LAUNCHPAD_GPG_KEY_ID: ${{ vars.LAUNCHPAD_GPG_KEY_ID }}
          LAUNCHPAD_GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
          LAUNCHPAD_GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
        run: |
          set -eu
          umask 077

          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          export GPG_PASSPHRASE_FILE="$RUNNER_TEMP/launchpad-gpg-passphrase"
          signer="$RUNNER_TEMP/dpkg-gpg-sign"
          trap 'gpgconf --kill gpg-agent >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME" "$GPG_PASSPHRASE_FILE" "$signer" vendor' EXIT
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          printf '%s' "$LAUNCHPAD_GPG_PRIVATE_KEY" | tr -d '\r' | gpg --batch --import
          printf '%s' "$LAUNCHPAD_GPG_PASSPHRASE" > "$GPG_PASSPHRASE_FILE"
          gpg --batch --with-colons --list-secret-keys "$LAUNCHPAD_GPG_KEY_ID" >/dev/null

          cat > "$signer" <<'EOF'
          #!/bin/sh
          set -eu
          exec gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "${GPG_PASSPHRASE_FILE:?}" "$@"
          EOF
          chmod 700 "$signer"

          changes_file="$(find .. -maxdepth 1 -type f -name '*_source.changes' -print -quit)"
          test -n "$changes_file"
          debsign -p"$signer" -k"$LAUNCHPAD_GPG_KEY_ID" "$changes_file"
          dput ppa:wg-frag/wg-frag-go "$changes_file"
