name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Go Checks / Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Go tests
        run: make test

  validation:
    name: Go Checks / Static, Race & Integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Download tool dependencies
        run: make tools-download

      - name: Verify generated protobuf
        run: make proto-check

      - name: Run race tests
        run: make test-race

      - name: Run static analysis
        run: go vet ./...

      - name: Run linters
        run: make lint

      - name: Install Linux networking tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 wireguard-tools

      - name: Run network-namespace integration
        run: sudo env PATH="$PATH" HOME="$HOME" make test-netns

  macos:
    name: Go Checks / macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Go tests
        run: go test ./...

      - name: Build macOS binaries
        run: |
          GOOS=darwin GOARCH=amd64 go build -o "$RUNNER_TEMP/wgf-darwin-amd64" ./cmd/wgf
          GOOS=darwin GOARCH=arm64 go build -o "$RUNNER_TEMP/wgf-darwin-arm64" ./cmd/wgf

  macos-qemu-e2e:
    name: Go Checks / macOS Linux E2E
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install QEMU dependencies
        run: brew install qemu squashfs

      - name: Run macOS host to Linux guest tunnel
        run: ruby scripts/macos-qemu-e2e.rb
